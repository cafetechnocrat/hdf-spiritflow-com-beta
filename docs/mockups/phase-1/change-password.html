<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spirit Flow</title>
<link rel="icon" type="image/png" href="../../../src/app/icon.png">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<div class="mock-note">Mockup. Sample data only. Not the real app.</div>
<div class="page">
  <main class="main">
    <section class="card" aria-labelledby="title">
      <div class="brand"><div class="brand-chip"><img class="brand-logo" src="../../../public/brand/spiritflow-logo.png" alt="Spirit Flow"></div></div>
      <h1 id="title">Set A New Password</h1>
      <p class="sub" id="sub">Your temporary password must be replaced before you continue.</p>

      <div class="alert" id="alert" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>
        <div><strong>Could not save.</strong> <span id="alert-text">The new passwords do not match.</span></div>
      </div>

      <form id="form" novalidate>
        <div class="field">
          <label class="lbl" for="current" id="current-lbl">Temporary Password</label>
          <div class="control has-toggle">
            <input id="current" type="password" autocomplete="current-password" placeholder="Enter the password you were given">
            <button class="toggle" type="button" data-target="current" aria-label="Show Password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        <div class="field">
          <label class="lbl" for="new" id="new-lbl">New Password</label>
          <div class="control has-toggle">
            <input id="new" type="password" autocomplete="new-password" placeholder="At least 10 characters">
            <button class="toggle" type="button" data-target="new" aria-label="Show Password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        <div class="field">
          <label class="lbl" for="confirm" id="confirm-lbl">Confirm New Password</label>
          <div class="control has-toggle">
            <input id="confirm" type="password" autocomplete="new-password" placeholder="Type the new password again">
            <button class="toggle" type="button" data-target="confirm" aria-label="Show Password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        <ul class="rules" aria-label="Password Rules">
          <li id="r1">At least 10 characters</li>
          <li id="r2">Different from the current password</li>
          <li id="r3">Both new passwords match</li>
        </ul>
        <button class="btn" type="submit">Save Password</button>
        <a class="btn secondary as-link" href="login.html" id="secondary">Sign Out</a>
      </form>
    </section>
  </main>
</div>
<div class="state-switch" role="group" aria-label="Mockup State">
  <button type="button" aria-pressed="true" id="s-forced">First Sign In</button>
  <button type="button" aria-pressed="false" id="s-profile">From My Profile</button>
</div>
<script>
  // Mockup behaviour only. The page shows both ways of reaching this screen.
  document.querySelectorAll(".toggle").forEach(function (b) {
    b.addEventListener("click", function () {
      var input = document.getElementById(b.dataset.target);
      var show = input.type === "password";
      input.type = show ? "text" : "password";
      b.setAttribute("aria-label", show ? "Hide Password" : "Show Password");
    });
  });
  var cur = document.getElementById("current"), nw = document.getElementById("new"), cf = document.getElementById("confirm");
  function check() {
    document.getElementById("r1").className = nw.value.length >= 10 ? "ok" : "";
    document.getElementById("r2").className = nw.value && nw.value !== cur.value ? "ok" : "";
    document.getElementById("r3").className = nw.value && nw.value === cf.value ? "ok" : "";
  }
  [cur, nw, cf].forEach(function (i) { i.addEventListener("input", check); });
  document.getElementById("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var a = document.getElementById("alert");
    var t = document.getElementById("alert-text");
    if (nw.value.length < 10) t.textContent = "The new password needs at least 10 characters.";
    else if (nw.value === cur.value) t.textContent = "The new password must be different from the current password.";
    else if (nw.value !== cf.value) t.textContent = "The new passwords do not match.";
    else { a.classList.remove("show"); window.alert("Mockup: the password would be saved and you would continue."); return; }
    a.classList.add("show");
  });
  function mode(forced) {
    document.getElementById("title").textContent = forced ? "Set A New Password" : "Change Password";
    document.getElementById("sub").textContent = forced ? "Your temporary password must be replaced before you continue." : "Enter your current password, then choose a new one.";
    document.getElementById("current-lbl").textContent = forced ? "Temporary Password" : "Current Password";
    document.getElementById("current").placeholder = forced ? "Enter the password you were given" : "Enter your current password";
    document.getElementById("secondary").textContent = forced ? "Sign Out" : "Cancel";
    document.getElementById("s-forced").setAttribute("aria-pressed", String(forced));
    document.getElementById("s-profile").setAttribute("aria-pressed", String(!forced));
    document.getElementById("alert").classList.remove("show");
  }
  document.getElementById("s-forced").addEventListener("click", function () { mode(true); });
  document.getElementById("s-profile").addEventListener("click", function () { mode(false); });
</script>
</body>
</html>
